    <style>
      :root {
        --bg: #f3f8f1;
        --card: #ffffff;
        --ink: #2f4330;
        --sub: #667866;
        --line: #d7e5d1;
        --primary: #5f8a57;
        --primary-deep: #45633e;
        --primary-soft: #eaf3e7;
        --danger: #b14747;
        --danger-soft: #fff2f2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family:
          "Hiragino Sans",
          "Yu Gothic",
          "Noto Sans JP",
          sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.8), transparent 42%),
          linear-gradient(180deg, #eef6ea 0%, var(--bg) 100%);
      }

      .wrap {
        width: min(560px, calc(100% - 32px));
        margin: 0 auto;
        padding: 40px 0;
      }

      .top-tools {
        display: flex;
        justify-content: flex-end;
        margin-bottom: 14px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid var(--line);
        font-size: 14px;
        font-weight: 700;
      }

      .brand-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: linear-gradient(180deg, #8db97f 0%, var(--primary) 100%);
      }

      .card {
        padding: 28px;
        background: rgba(255, 255, 255, 0.96);
        border: 1px solid var(--line);
        border-radius: 28px;
        box-shadow: 0 24px 48px rgba(47, 67, 48, 0.1);
      }

      .status-chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: var(--primary-soft);
        color: var(--primary-deep);
        font-size: 13px;
        font-weight: 700;
      }

      .status-chip.error {
        background: var(--danger-soft);
        color: var(--danger);
      }

      .spinner {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(95, 138, 87, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      h1 {
        margin: 16px 0 12px;
        font-size: clamp(28px, 6vw, 38px);
        line-height: 1.25;
      }

      p {
        margin: 0;
        color: var(--sub);
        line-height: 1.8;
        font-size: 16px;
      }

      .detail {
        margin-top: 12px;
        padding: 14px 16px;
        border-radius: 18px;
        background: #f8fbf7;
        border: 1px solid rgba(215, 229, 209, 0.9);
        font-size: 14px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 22px;
      }

      .button,
      .link-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 52px;
        padding: 0 18px;
        border-radius: 18px;
        text-decoration: none;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
      }

      .button {
        border: none;
        background: var(--primary);
        color: #ffffff;
      }

      .button.secondary,
      .link-button {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }

      .footnote {
        margin-top: 24px;
        font-size: 13px;
        color: var(--sub);
      }

      @media (max-width: 480px) {
        .wrap {
          width: calc(100% - 20px);
          padding: 20px 0;
        }

        .card {
          padding: 22px 18px;
          border-radius: 24px;
        }

        .actions {
          flex-direction: column;
        }

        .button,
        .link-button {
          width: 100%;
        }
      }
    </style>
  </head>

        <p id="detail" class="detail" hidden></p>

        <div id="actions" class="actions" hidden>

    </main>

          return;
        }
        if (currentViewState.kind === "error") {
          renderErrorState(
            currentViewState.messageKey,
            currentViewState.detailKey,
          );
          return;
        }
        renderLoadingState();
      }

      function setLoadingState() {
        currentViewState = { kind: "loading" };
        renderLoadingState();
      }

      function renderLoadingState() {
        statusChip.classList.remove("error");
        statusText.textContent = translate("loadingChip");
        statusIcon.className = "spinner";
        statusIcon.textContent = "";
        title.textContent = translate("loadingTitle");
        message.textContent = translate("loadingBody");
        detail.hidden = true;
        detail.textContent = "";
        actions.hidden = true;
        backButton.textContent = translate("backButton");
        continueButton.textContent = translate("continueButton");
      }

      function setSuccessState(email) {
        currentViewState = { kind: "success", email };
        renderSuccessState(email);
      }

      function renderSuccessState(email) {
        statusChip.classList.remove("error");
        statusText.textContent = translate("successChip");
        statusIcon.className = "";
        statusIcon.textContent = "✓";
        title.textContent = translate("successTitle");
        message.textContent = email
          ? translate("successBodyWithEmail", { email })
          : translate("successBody");
        detail.hidden = false;
        detail.textContent = translate("successDetail");
        actions.hidden = false;
        backButton.textContent = translate("backButton");
        continueButton.textContent = translate("continueButton");

        if (continueUrl) {
          continueButton.hidden = false;
          continueButton.href = continueUrl;
        } else {
          continueButton.hidden = true;
        }
      }

      function setErrorState(messageKey, detailKey) {
        currentViewState = { kind: "error", messageKey, detailKey };
        renderErrorState(messageKey, detailKey);
      }

      function renderErrorState(messageKey, detailKey) {
        statusChip.classList.add("error");
        statusText.textContent = translate("errorChip");
        statusIcon.className = "";
        statusIcon.textContent = "!";
        title.textContent = translate("errorTitle");
        message.textContent = translate(messageKey || "errorGeneric");
        detail.hidden = !detailKey;
        detail.textContent = detailKey ? translate(detailKey) : "";
        actions.hidden = false;
        backButton.textContent = translate("backButton");
        continueButton.textContent = translate("continueButton");
        continueButton.hidden = true;
      }

      function errorMessageForCode(code) {
        switch (code) {
          case "auth/expired-action-code":
            return "expiredActionCode";
          case "auth/invalid-action-code":
            return "invalidActionCode";
          case "auth/user-disabled":
            return "userDisabled";
          case "auth/user-not-found":
            return "userNotFound";
          case "auth/network-request-failed":
            return "networkError";
          default:
            return "errorGeneric";
        }
      }

      async function main() {
        if (mode !== "verifyEmail") {
          setErrorState(
            "invalidModeError",
            "invalidModeDetail",
          );
          return;
        }

        if (!actionCode || !apiKey) {
          setErrorState(
            "invalidParamsError",
            "invalidParamsDetail",
          );
          return;
        }

        setLoadingState();

        try {
          const app = initializeApp({
            apiKey,
            authDomain,
            projectId,
          });
          const auth = getAuth(app);

          const actionInfo = await checkActionCode(auth, actionCode);
          const email =
            actionInfo?.data?.email ||
            actionInfo?.data?.previousEmail ||
            "";

          await applyActionCode(auth, actionCode);
          setSuccessState(email);
        } catch (error) {
          console.error(error);
          setErrorState(
            errorMessageForCode(error?.code),
            "errorRetryDetail",
          );
        }
      }

      main();
    </script>
  </body>
</html>
